# ci so it runs offline tests on every push n pull req.
#no api key needed, tests fake Gemini
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:   

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Build the Docker image
        run: docker build -t htprs .

      - name: Run the offline tests inside the container
        run: docker run --rm htprs python main.py --test