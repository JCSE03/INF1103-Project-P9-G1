<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk Dashboard</title>
    <style>
        :root {
            --navy: #102a43;
            --blue: #1769aa;
            --blue-soft: #eaf4ff;
            --ink: #243b53;
            --muted: #627d98;
            --line: #d9e2ec;
            --page: #f5f8fb;
            --card: #ffffff;
            --success-bg: #e8f7ef;
            --success-text: #0c5132;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--ink);
            background: var(--page);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 20px 24px;
            color: white;
            background: var(--navy);
        }

        .topbar h1 { margin: 0; font-size: 21px; }
        .topbar p { margin: 4px 0 0; color: #bcccdc; font-size: 13px; }

        .live-status {
            padding: 8px 11px;
            color: #d9e2ec;
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 999px;
            font-size: 13px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px 50px;
        }

        h2, h3, h4 { color: var(--navy); }

        .toolbar, .queue-summary, .ticket-card, .empty-state {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(16, 42, 67, .05);
        }

        .toolbar {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 18px;
            padding: 18px;
            margin: 22px 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--navy);
            font-size: 13px;
            font-weight: bold;
        }

        select {
            min-width: 230px;
            padding: 10px;
            font: inherit;
            border: 1px solid #bcccdc;
            border-radius: 7px;
        }

        a { color: var(--blue); }

        .queue-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            overflow: hidden;
            margin-bottom: 28px;
            background: var(--line);
        }

        .queue-stat {
            padding: 16px;
            background: white;
        }

        .queue-stat strong {
            display: block;
            margin-top: 4px;
            color: var(--navy);
            font-size: 25px;
        }

        .queue-stat span {
            color: var(--muted);
            font-size: 13px;
        }

        /* Split Columns Layout */
        .dashboard-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--line);
        }

        .column-header h3 { margin: 0; }
        .ticket-count-badge {
            background: var(--blue-soft);
            color: var(--blue);
            font-size: 12px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .ticket-list {
            display: grid;
            gap: 16px;
        }

        .ticket-card { overflow: hidden; }

        .ticket-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 18px;
            color: #0c5132;
            background: #e8f7ef;
            border-bottom: 1px solid #c2ebd2;
            font-size: 13px;
            font-weight: bold;
        }

        .ticket-card.is-resolved .ticket-banner {
            background: #f0f4f8;
            color: #486581;
            border-bottom-color: #d9e2ec;
        }

        .ticket-body { padding: 18px; }
        
        .ticket-header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .ticket-title { margin: 0; font-size: 18px; }

        .resolve-btn {
            padding: 6px 12px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            background: #27ab83;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .resolve-btn:hover { background: #198754; }

        .unresolve-btn {
            padding: 6px 12px;
            color: var(--ink);
            font-size: 12px;
            font-weight: bold;
            background: #e4e7eb;
            border: 1px solid #cbd2d9;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .unresolve-btn:hover { background: #cbd2d9; }

        .resolved-info {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
            font-weight: normal;
        }

        .ticket-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .field + .field { margin-top: 10px; }

        .field-label {
            display: block;
            margin-bottom: 2px;
            color: var(--muted);
            font-size: 10px;
            font-weight: bold;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .field-value {
            margin: 0;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .classification {
            padding: 12px;
            background: var(--blue-soft);
            border: 1px solid #cde4fa;
            border-radius: 8px;
        }

        .classification-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .classification-item {
            padding: 8px;
            background: rgba(255, 255, 255, .75);
            border-radius: 6px;
        }

        .classification-item strong {
            display: block;
            margin-bottom: 2px;
            color: #486581;
            font-size: 9px;
            text-transform: uppercase;
        }

        .classification-item span { font-size: 12px; }

        .empty-state {
            padding: 28px 16px;
            color: var(--muted);
            text-align: center;
            font-size: 14px;
        }

        .hidden { display: none; }

        @media (max-width: 960px) {
            .dashboard-columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-initial-department="{{ initial_department }}">
    <header class="topbar">
        <div>
            <h1>IT Helpdesk</h1>
            <p>AI-classified ticket queues</p>
        </div>
        <div class="live-status" id="live-status">Checking for updates…</div>
    </header>

    <main>
        <h2 id="page-title">Helpdesk dashboard</h2>
        <p id="page-description">Review incoming tickets and their AI classifications.</p>

        <section class="toolbar">
            <div>
                <label for="department-filter">Department queue</label>
                <select id="department-filter">
                    <option value="all">All departments</option>
                    {% for department in departments %}
                    <option value="{{ department }}">{{ department }}</option>
                    {% endfor %}
                </select>
            </div>
            <a href="/">← Submit a new ticket</a>
        </section>

        <section class="queue-summary" id="queue-summary"></section>

        <!-- Columned Layout -->
        <div class="dashboard-columns">
            <!-- Active Tickets Column -->
            <section>
                <div class="column-header">
                    <h3>Active Tickets</h3>
                    <span class="ticket-count-badge" id="active-count">0</span>
                </div>
                <div class="ticket-list" id="active-ticket-list"></div>
                <div class="empty-state hidden" id="active-empty-state">No active tickets</div>
            </section>

            <!-- Resolved Tickets Column -->
            <section>
                <div class="column-header">
                    <h3>Resolved Tickets</h3>
                    <span class="ticket-count-badge" id="resolved-count">0</span>
                </div>
                <div class="ticket-list" id="resolved-ticket-list"></div>
                <div class="empty-state hidden" id="resolved-empty-state">No resolved tickets</div>
            </section>
        </div>
    </main>

    <script>
        const initialDepartment = document.body.dataset.initialDepartment;
        const departmentFilter = document.getElementById("department-filter");
        const activeList = document.getElementById("active-ticket-list");
        const resolvedList = document.getElementById("resolved-ticket-list");
        const activeEmpty = document.getElementById("active-empty-state");
        const resolvedEmpty = document.getElementById("resolved-empty-state");
        const activeCount = document.getElementById("active-count");
        const resolvedCount = document.getElementById("resolved-count");
        const departments = ["Cyber", "Finance", "HR", "Infra"];

        departmentFilter.value = initialDepartment;

        function text(value, fallback = "Not provided") {
            return value === undefined || value === null || value === "" ? fallback : String(value);
        }

        function queueCard(label, count) {
            const card = document.createElement("div");
            card.className = "queue-stat";
            card.innerHTML = `<span>${label}</span><strong>${count}</strong>`;
            return card;
        }

        function renderQueue(queue) {
            const summary = document.getElementById("queue-summary");
            summary.replaceChildren();

            if (departmentFilter.value === "all") {
                departments.forEach((department) => {
                    const details = queue.departments[department] || { queued: 0 };
                    summary.appendChild(queueCard(`${department} queued`, details.queued));
                });
            } else {
                const details = queue.departments[departmentFilter.value] || { queued: 0 };
                summary.appendChild(queueCard("Queued tickets", details.queued));
                summary.appendChild(queueCard("All department tickets", details.total));
            }
        }

        function addField(container, label, value) {
            const field = document.createElement("div");
            field.className = "field";
            field.innerHTML = `<span class="field-label">${label}</span><p class="field-value">${text(value)}</p>`;
            container.appendChild(field);
        }

        function addClassificationItem(container, label, value) {
            const item = document.createElement("div");
            item.className = "classification-item";
            item.innerHTML = `<strong>${label}</strong><span>${text(value)}</span>`;
            container.appendChild(item);
        }

        async function toggleResolution(ticketId, targetStatus) {
            try {
                const response = await fetch(`/api/tickets/${encodeURIComponent(ticketId)}/toggle-resolution`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ is_resolved: targetStatus })
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    alert(data.error || "Action failed.");
                    return;
                }

                loadTickets();
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        }

        function renderTicket(ticket) {
            const result = ticket.result || {};
            const card = document.createElement("article");
            card.className = `ticket-card ${ticket.is_resolved ? 'is-resolved' : ''}`;

            const banner = document.createElement("div");
            banner.className = "ticket-banner";
            banner.innerHTML = `
                <span>${text(result.department)} · ${text(result.queue_status)}</span>
                <span>${text(ticket.ticket_id)} · Position ${text(ticket.queue_position)}</span>
            `;

            const body = document.createElement("div");
            body.className = "ticket-body";

            const headerRow = document.createElement("div");
            headerRow.className = "ticket-header-row";

            const title = document.createElement("h4");
            title.className = "ticket-title";
            title.textContent = text(ticket.ticket_title, "Untitled ticket");

            const actionBtn = document.createElement("button");
            if (ticket.is_resolved) {
                actionBtn.className = "unresolve-btn";
                actionBtn.textContent = "Unresolve";
                actionBtn.onclick = () => toggleResolution(ticket.ticket_id, false);
            } else {
                actionBtn.className = "resolve-btn";
                actionBtn.textContent = "Mark as resolved";
                actionBtn.onclick = () => toggleResolution(ticket.ticket_id, true);
            }

            const actionContainer = document.createElement("div");
            actionContainer.appendChild(actionBtn);

            if (ticket.is_resolved && ticket.resolved_at) {
                const info = document.createElement("span");
                info.className = "resolved-info";
                info.textContent = `Resolved: ${new Date(ticket.resolved_at).toLocaleString()}`;
                actionContainer.appendChild(info);
            }

            headerRow.append(title, actionContainer);

            const grid = document.createElement("div");
            grid.className = "ticket-grid";

            const details = document.createElement("div");
            addField(details, "Submitted by", ticket.name);
            addField(details, "Contact", ticket.contact_number);
            addField(details, "Description", ticket.problem_description);

            const classification = document.createElement("aside");
            classification.className = "classification";
            const classificationGrid = document.createElement("div");
            classificationGrid.className = "classification-grid";

            addClassificationItem(classificationGrid, "Category", result.category);
            addClassificationItem(classificationGrid, "Severity", result.severity);
            addClassificationItem(classificationGrid, "Scope", result.affected_scope);
            addClassificationItem(classificationGrid, "Department", result.department);

            classification.appendChild(classificationGrid);
            grid.append(details, classification);
            body.append(headerRow, grid);
            card.append(banner, body);

            return card;
        }

        async function loadTickets() {
            const department = departmentFilter.value;

            try {
                const response = await fetch(
                    `/api/tickets?department=${encodeURIComponent(department)}`,
                    { cache: "no-store" }
                );

                if (!response.ok) throw new Error("Unable to load tickets");

                const data = await response.json();
                activeList.replaceChildren();
                resolvedList.replaceChildren();
                renderQueue(data.queue);

                const activeTickets = data.tickets.filter(t => !t.is_resolved);
                const resolvedTickets = data.tickets.filter(t => t.is_resolved);

                activeCount.textContent = activeTickets.length;
                resolvedCount.textContent = resolvedTickets.length;

                activeTickets.forEach(ticket => activeList.appendChild(renderTicket(ticket)));
                resolvedTickets.forEach(ticket => resolvedList.appendChild(renderTicket(ticket)));

                activeEmpty.classList.toggle("hidden", activeTickets.length > 0);
                resolvedEmpty.classList.toggle("hidden", resolvedTickets.length > 0);

                document.getElementById("live-status").textContent = "Live updates active";
            } catch {
                document.getElementById("live-status").textContent = "Unable to load queue updates";
            }
        }

        departmentFilter.addEventListener("change", () => {
            const department = departmentFilter.value;
            window.location.assign(
                department === "all"
                    ? "/helpdesk"
                    : `/departments/${encodeURIComponent(department)}`
            );
        });

        loadTickets();
        window.setInterval(loadTickets, 5000);
    </script>
</body>
</html>
