<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk Dashboard</title>

    <style>
        :root {
            --navy: #102a43;
            --blue: #1769aa;
            --blue-soft: #eaf4ff;
            --ink: #243b53;
            --muted: #627d98;
            --line: #d9e2ec;
            --page: #f5f8fb;
            --card: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--ink);
            background: var(--page);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 20px 24px;
            color: white;
            background: var(--navy);
        }

        .topbar h1 {
            margin: 0;
            font-size: 21px;
        }

        .topbar p {
            margin: 4px 0 0;
            color: #bcccdc;
            font-size: 13px;
        }

        .live-status {
            padding: 8px 11px;
            color: #d9e2ec;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            font-size: 13px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px 50px;
        }

        h2, h3, h4 {
            color: var(--navy);
        }

        .toolbar,
        .queue-summary,
        .ticket-card,
        .empty-state {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(16, 42, 67, 0.05);
        }

        .toolbar {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 18px;
            padding: 18px;
            margin: 22px 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--navy);
            font-size: 13px;
            font-weight: bold;
        }

        select {
            min-width: 230px;
            padding: 10px;
            font: inherit;
            border: 1px solid #bcccdc;
            border-radius: 7px;
        }

        a {
            color: var(--blue);
        }

        .queue-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            overflow: hidden;
            margin-bottom: 28px;
            background: var(--line);
        }

        .queue-stat {
            padding: 16px;
            background: white;
        }

        .queue-stat strong {
            display: block;
            margin-top: 4px;
            color: var(--navy);
            font-size: 25px;
        }

        .queue-stat span {
            color: var(--muted);
            font-size: 13px;
        }

        .dashboard-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--line);
        }

        .column-header h3 {
            margin: 0;
        }

        .ticket-count-badge {
            padding: 4px 8px;
            color: var(--blue);
            background: var(--blue-soft);
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .ticket-list {
            display: grid;
            gap: 16px;
        }

        .ticket-card {
            overflow: hidden;
        }

        .ticket-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 18px;
            color: #0c5132;
            background: #e8f7ef;
            border-bottom: 1px solid #c2ebd2;
            font-size: 13px;
            font-weight: bold;
        }

        .ticket-card.is-resolved .ticket-banner {
            color: #486581;
            background: #f0f4f8;
            border-bottom-color: #d9e2ec;
        }

        .ticket-body {
            padding: 18px;
        }

        .ticket-header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .ticket-title {
            margin: 0;
            font-size: 18px;
        }

        .resolve-btn,
        .unresolve-btn {
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .resolve-btn {
            color: white;
            background: #27ab83;
            border: none;
        }

        .unresolve-btn {
            color: var(--ink);
            background: #e4e7eb;
            border: 1px solid #cbd2d9;
        }

        .resolved-info {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
        }

        .ticket-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .field + .field {
            margin-top: 10px;
        }

        .field-label {
            display: block;
            margin-bottom: 2px;
            color: var(--muted);
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .field-value {
            margin: 0;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .classification {
            padding: 12px;
            background: var(--blue-soft);
            border: 1px solid #cde4fa;
            border-radius: 8px;
        }

        .classification-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .classification-item {
            padding: 8px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 6px;
        }

        .classification-item strong {
            display: block;
            margin-bottom: 2px;
            color: #486581;
            font-size: 9px;
            text-transform: uppercase;
        }

        .classification-item span {
            font-size: 12px;
        }

        .empty-state {
            padding: 28px 16px;
            color: var(--muted);
            text-align: center;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 960px) {
            .dashboard-columns {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .topbar,
            .toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .queue-summary,
            .classification-grid {
                grid-template-columns: 1fr;
            }

            select {
                width: 100%;
            }
        }
        .review-note {
            margin: 12px 0 0;
            padding: 8px 10px;
            color: #664d03;
            background: #fff3cd;
            border-radius: 6px;
            font-size: 12px;
        }
    </style>
</head>

<body data-initial-department="{{ initial_department }}">
    <header class="topbar">
        <div>
            <h1>IT Helpdesk</h1>
            <p>AI-classified ticket queues</p>
        </div>

        <div class="live-status" id="live-status">
            Checking for updates…
        </div>
    </header>

    <main>
        <h2 id="page-title">Helpdesk Dashboard</h2>
        <p id="page-description">
            Review incoming tickets and their AI classifications.
        </p>

        <section class="toolbar">
            <div>
                <label for="department-filter">Department Queue</label>

                <select id="department-filter">
                    <option value="all">All departments</option>
                    {% for department in departments %}
                    <option value="{{ department }}">{{ department }}</option>
                    {% endfor %}
                </select>
            </div>

            <a href="/">← Submit a new ticket</a>
        </section>

        <section class="queue-summary" id="queue-summary"></section>

        <div class="dashboard-columns">
            <section>
                <div class="column-header">
                    <h3>Active Tickets</h3>
                    <span class="ticket-count-badge" id="active-count">0</span>
                </div>

                <div class="ticket-list" id="active-ticket-list"></div>

                <div class="empty-state hidden" id="active-empty-state">
                    No active tickets in this queue.
                </div>
            </section>

            <section>
                <div class="column-header">
                    <h3>Resolved Tickets</h3>
                    <span class="ticket-count-badge" id="resolved-count">0</span>
                </div>

                <div class="ticket-list" id="resolved-ticket-list"></div>

                <div class="empty-state hidden" id="resolved-empty-state">
                    No resolved tickets in this queue.
                </div>
            </section>
        </div>
    </main>

    <script>
        const initialDepartment = document.body.dataset.initialDepartment;
        const departmentFilter = document.getElementById("department-filter");
        const activeList = document.getElementById("active-ticket-list");
        const resolvedList = document.getElementById("resolved-ticket-list");
        const activeEmpty = document.getElementById("active-empty-state");
        const resolvedEmpty = document.getElementById("resolved-empty-state");
        const activeCount = document.getElementById("active-count");
        const resolvedCount = document.getElementById("resolved-count");

        const departments = ["Cyber", "Finance", "HR", "Infra"];

        departmentFilter.value = initialDepartment;

        function text(value, fallback = "Not provided") {
            return value === undefined || value === null || value === ""
                ? fallback
                : String(value);
        }

        function formatAffectedScope(scope) {
            const scopeLabels = {
                individual: "One person",
                multiple_users: "Multiple users",
                department: "One department or team",
                organisation: "Organisation-wide"
            };

            return scopeLabels[scope] || text(scope);
        }

        function queueCard(label, count) {
            const card = document.createElement("div");
            card.className = "queue-stat";

            const labelElement = document.createElement("span");
            labelElement.textContent = label;

            const countElement = document.createElement("strong");
            countElement.textContent = count;

            card.append(labelElement, countElement);
            return card;
        }

        // Active (queued) and total tickets per department.
        function queueCounts(tickets) {
            const counts = { departments: {} };
            for (const department of departments) {
                const inDepartment = tickets.filter(t => t.department === department);
                counts.departments[department] = {
                    total: inDepartment.length,
                    queued: inDepartment.filter(t => !t.is_resolved).length
                };
            }
            return counts;
        }

        function renderQueue(queue) {
            const summary = document.getElementById("queue-summary");
            summary.replaceChildren();

            if (departmentFilter.value === "all") {
                departments.forEach((department) => {
                    const details = queue.departments[department] || { queued: 0 };

                    summary.appendChild(
                        queueCard(`${department} queued`, details.queued)
                    );
                });

                return;
            }

            const details = queue.departments[departmentFilter.value] || {
                queued: 0,
                total: 0
            };

            summary.appendChild(queueCard("Queued tickets", details.queued));
            summary.appendChild(
                queueCard("All department tickets", details.total)
            );
        }

        function addField(container, label, value) {
            const field = document.createElement("div");
            field.className = "field";

            const fieldLabel = document.createElement("span");
            fieldLabel.className = "field-label";
            fieldLabel.textContent = label;

            const fieldValue = document.createElement("p");
            fieldValue.className = "field-value";
            fieldValue.textContent = text(value);

            field.append(fieldLabel, fieldValue);
            container.appendChild(field);
        }

        function addClassificationItem(container, label, value) {
            const item = document.createElement("div");
            item.className = "classification-item";

            const itemLabel = document.createElement("strong");
            itemLabel.textContent = label;

            const itemValue = document.createElement("span");
            itemValue.textContent = text(value);

            item.append(itemLabel, itemValue);
            container.appendChild(item);
        }

        async function toggleResolution(ticketId, isResolved) {
            try {
                const response = await fetch(
                    `/api/tickets/${encodeURIComponent(ticketId)}/toggle-resolution`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            is_resolved: isResolved
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || data.status !== "success") {
                    alert(data.reason || "Could not update the ticket.");
                    return;
                }

                loadTickets();
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function renderTicket(ticket) {
            // Saved tickets are flat records: AI fields, priority and
            // department sit directly on the ticket (see logic_manager).
            const result = ticket;
            const card = document.createElement("article");

            card.className = ticket.is_resolved
                ? "ticket-card is-resolved"
                : "ticket-card";

            const banner = document.createElement("div");
            banner.className = "ticket-banner";

            const departmentText = document.createElement("span");
            departmentText.textContent =
                `${text(ticket.priority, "P?")} · ${text(result.department)}`;

            const ticketInfo = document.createElement("span");
            ticketInfo.textContent =
                `${text(ticket.ticket_id)} · Score ${text(ticket.priority_score)}`;

            banner.append(departmentText, ticketInfo);

            const body = document.createElement("div");
            body.className = "ticket-body";

            const headerRow = document.createElement("div");
            headerRow.className = "ticket-header-row";

            const title = document.createElement("h4");
            title.className = "ticket-title";
            title.textContent = text(ticket.ticket_title, "Untitled ticket");

            const actionContainer = document.createElement("div");
            const actionButton = document.createElement("button");

            if (ticket.is_resolved) {
                actionButton.className = "unresolve-btn";
                actionButton.textContent = "Unresolve";
                actionButton.onclick = () =>
                    toggleResolution(ticket.ticket_id, false);

                if (ticket.resolved_at) {
                    const resolvedInfo = document.createElement("span");
                    resolvedInfo.className = "resolved-info";
                    resolvedInfo.textContent =
                        `Resolved: ${new Date(ticket.resolved_at).toLocaleString()}`;

                    actionContainer.appendChild(resolvedInfo);
                }
            } else {
                actionButton.className = "resolve-btn";
                actionButton.textContent = "Mark as resolved";
                actionButton.onclick = () =>
                    toggleResolution(ticket.ticket_id, true);
            }

            actionContainer.prepend(actionButton);
            headerRow.append(title, actionContainer);

            const grid = document.createElement("div");
            grid.className = "ticket-grid";

            const details = document.createElement("div");
            addField(details, "Submitted by", ticket.name);
            addField(details, "Contact number", ticket.contact_number);
            // The raw description is not stored (it may contain redacted
            // details); the AI summary is shown in the classification box.
            addField(details, "Submitted", ticket.submitted_at
                ? new Date(ticket.submitted_at).toLocaleString()
                : undefined);

            const classification = document.createElement("aside");
            classification.className = "classification";

            const classificationGrid = document.createElement("div");
            classificationGrid.className = "classification-grid";

            addClassificationItem(classificationGrid, "Category", result.category);
            addClassificationItem(classificationGrid, "Severity", result.severity);
            addClassificationItem(
                classificationGrid,
                "Affected users (AI estimate)",
                formatAffectedScope(result.affected_scope)
            );
            addClassificationItem(
                classificationGrid,
                "Department",
                result.department
            );
            addClassificationItem(
                classificationGrid,
                "AI summary",
                result.summary
            );

            classification.appendChild(classificationGrid);

            grid.append(details, classification);
            body.append(headerRow, grid);

            if (ticket.needs_review && !ticket.is_resolved) {
                const note = document.createElement("p");
                note.className = "review-note";
                note.textContent =
                    "Needs human review: low AI confidence or a privileged account was mentioned.";
                body.appendChild(note);
            }

            card.append(banner, body);

            return card;
        }

        async function loadTickets() {
            const department = departmentFilter.value;

            try {
                // /queue returns tickets already sorted most urgent first.
                const response = await fetch(
                    `/queue?department=${encodeURIComponent(department === "all" ? "" : department)}`,
                    {
                        cache: "no-store"
                    }
                );

                if (!response.ok) {
                    throw new Error("Unable to load tickets");
                }

                const data = await response.json();

                activeList.replaceChildren();
                resolvedList.replaceChildren();

                renderQueue(queueCounts(data.tickets));

                const activeTickets = data.tickets.filter(
                    (ticket) => !ticket.is_resolved
                );

                const resolvedTickets = data.tickets.filter(
                    (ticket) => ticket.is_resolved
                );

                activeCount.textContent = activeTickets.length;
                resolvedCount.textContent = resolvedTickets.length;

                activeTickets.forEach((ticket) => {
                    activeList.appendChild(renderTicket(ticket));
                });

                resolvedTickets.forEach((ticket) => {
                    resolvedList.appendChild(renderTicket(ticket));
                });

                activeEmpty.classList.toggle(
                    "hidden",
                    activeTickets.length > 0
                );

                resolvedEmpty.classList.toggle(
                    "hidden",
                    resolvedTickets.length > 0
                );

                document.getElementById("live-status").textContent =
                    "Live updates active";
            } catch (error) {
                document.getElementById("live-status").textContent =
                    "Unable to load queue updates";
            }
        }

        departmentFilter.addEventListener("change", () => {
            const department = departmentFilter.value;

            window.location.assign(
                department === "all"
                    ? "/helpdesk"
                    : `/departments/${encodeURIComponent(department)}`
            );
        });

        loadTickets();
        window.setInterval(loadTickets, 5000);
    </script>
</body>
</html>
