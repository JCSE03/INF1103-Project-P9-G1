<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support Request</title>

    <style>
        :root {
            --navy: #102a43;
            --blue: #1769aa;
            --blue-dark: #0f4f82;
            --page: #eef4f8;
            --card: #ffffff;
            --line: #d9e2ec;
            --text: #243b53;
            --success-bg: #e8f7ef;
            --success-text: #0c5132;
            --error-bg: #fdecec;
            --error-text: #8a1c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 18px;
            font-family: Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, #d7ecff 0, transparent 36%),
                var(--page);
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(16, 42, 67, 0.12);
        }

        .header {
            padding: 30px 34px 25px;
            color: white;
            background: linear-gradient(135deg, var(--navy), var(--blue));
        }

        .header-icon {
            display: grid;
            width: 44px;
            height: 44px;
            margin-bottom: 14px;
            place-items: center;
            font-size: 22px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 12px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        .header p {
            margin: 8px 0 0;
            color: #d9eafd;
            line-height: 1.5;
        }

        form {
            padding: 12px 34px 34px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            color: var(--navy);
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            color: var(--text);
            font: inherit;
            background: white;
            border: 1px solid #bcccdc;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.14);
        }

        textarea {
            min-height: 145px;
            resize: vertical;
        }

        textarea::placeholder {
            color: #829ab1;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            width: 100%;
            margin-top: 26px;
            padding: 13px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: var(--blue);
            border: none;
            border-radius: 8px;
            transition: background 0.15s, transform 0.15s;
        }

        button:hover {
            background: var(--blue-dark);
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
            transform: none;
        }

        #result-box {
            display: none;
            margin-top: 20px;
            padding: 13px 14px;
            border-radius: 8px;
            line-height: 1.45;
        }

        #result-box.success {
            color: var(--success-text);
            background: var(--success-bg);
            border: 1px solid #c2ebd2;
        }

        #result-box.error {
            color: var(--error-text);
            background: var(--error-bg);
            border: 1px solid #f5c2c7;
        }

        #troubleshoot-box {
            display: none;
            margin-top: 20px;
            padding: 16px 18px;
            background: #f0f7ff;
            border: 1px solid #b6d6f2;
            border-radius: 8px;
            line-height: 1.45;
        }

        #troubleshoot-box h2 {
            margin: 0 0 6px;
            color: var(--navy);
            font-size: 17px;
        }

        #troubleshoot-box p {
            margin: 0 0 10px;
        }

        #troubleshoot-box ol {
            margin: 0 0 4px;
            padding-left: 22px;
        }

        #troubleshoot-box li {
            margin-bottom: 6px;
        }

        .choice-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .choice-row button {
            margin-top: 14px;
        }

        button.secondary {
            color: var(--blue-dark);
            background: white;
            border: 1px solid var(--blue);
        }

        button.secondary:hover {
            background: #e6f1fb;
        }

        @media (max-width: 560px) {
            .choice-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        @media (max-width: 560px) {
            body {
                padding: 20px 12px;
            }

            .header,
            form {
                padding-right: 22px;
                padding-left: 22px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="header">
            <div class="header-icon">?</div>
            <h1>IT Support Request</h1>
            <p>Tell us what you need help with and our support team will review your request.</p>
        </header>

        <form id="ticket-form">
            <label for="ticket_title">Ticket Title</label>
            <input
                type="text"
                id="ticket_title"
                name="ticket_title"
                placeholder="For example: Unable to connect to VPN"
                required
            >

            <div class="form-row">
                <div>
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="contact_number">Contact Number</label>
                    <input
                        type="tel"
                        id="contact_number"
                        name="contact_number"
                        autocomplete="tel"
                        required
                    >
                </div>
            </div>

            <label for="problem_description">Problem Description</label>
            <textarea
                id="problem_description"
                name="problem_description"
                placeholder="Please describe the issue, including any error messages you see."
                required
            ></textarea>

            <button type="submit" id="submit-button">Submit Support Request</button>

            <div id="troubleshoot-box" role="region" aria-live="polite">
                <h2>Try these steps first</h2>
                <p id="troubleshoot-summary"></p>
                <ol id="troubleshoot-steps"></ol>
                <div class="choice-row">
                    <button type="button" id="solved-button">It's fixed, cancel my request</button>
                    <button type="button" id="unsolved-button" class="secondary">Still not working, send to IT</button>
                </div>
            </div>

            <div id="result-box" role="status" aria-live="polite"></div>
        </form>
    </main>

    <script>
        const form = document.getElementById("ticket-form");
        const button = document.getElementById("submit-button");
        const resultBox = document.getElementById("result-box");
        const troubleshootBox = document.getElementById("troubleshoot-box");
        const stepsList = document.getElementById("troubleshoot-steps");
        const solvedButton = document.getElementById("solved-button");
        const unsolvedButton = document.getElementById("unsolved-button");
        let pendingId = null;

        function showResult(text, kind) {
            resultBox.textContent = text;
            resultBox.className = kind;
            resultBox.style.display = "block";
        }

        function showSubmitted(data) {
            showResult(
                `Request ${data.ticket.ticket_id} submitted (${data.ticket.priority}, ` +
                `routed to ${data.ticket.department}). Our IT team will be in touch.`,
                "success");
        }

        function showTroubleshooting(data) {
            pendingId = data.pending_id;
            document.getElementById("troubleshoot-summary").textContent =
                "We understood your issue as: " + data.summary + " These quick steps might fix it before we send it to IT.";
            stepsList.replaceChildren();
            data.steps.forEach(function (step) {
                const item = document.createElement("li");
                item.textContent = step;
                stepsList.appendChild(item);
            });
            troubleshootBox.style.display = "block";
            button.disabled = true;
        }

        function hideTroubleshooting() {
            troubleshootBox.style.display = "none";
            pendingId = null;
            button.disabled = false;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            button.textContent = "Submitting Request…";
            button.disabled = true;
            resultBox.style.display = "none";
            resultBox.className = "";
            hideTroubleshooting();
            button.disabled = true;

            const ticketData = {
                ticket_title: document.getElementById("ticket_title").value,
                name: document.getElementById("name").value,
                contact_number: document.getElementById("contact_number").value,
                problem_description: document.getElementById("problem_description").value
            };

            try {
                const response = await fetch("/submit-ticket", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(ticketData)
                });

                const data = await response.json();

                if (response.ok && data.status === "troubleshoot") {
                    showTroubleshooting(data);   // ticket not sent yet
                    return;
                }
                if (!response.ok || data.status !== "success") {
                    throw new Error(data.reason || "Could not submit the support request.");
                }

                form.reset();
                showSubmitted(data);
                button.disabled = false;
            } catch (error) {
                showResult(`Error: ${error.message}`, "error");
                button.disabled = false;
            } finally {
                button.textContent = "Submit Support Request";
            }
        });

        // The user says whether the steps worked: fixed -> cancel, not fixed -> send to IT.
        async function answerTroubleshooting(resolved) {
            solvedButton.disabled = true;
            unsolvedButton.disabled = true;
            try {
                const response = await fetch("/api/tickets/troubleshoot-result", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ pending_id: pendingId, resolved: resolved })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.reason || "Could not complete your request.");
                }

                hideTroubleshooting();
                form.reset();
                if (data.status === "cancelled") {
                    showResult("Glad that fixed it! Your request has been cancelled and nothing was sent to IT.", "success");
                } else {
                    showSubmitted(data);
                }
            } catch (error) {
                hideTroubleshooting();
                showResult(`Error: ${error.message}`, "error");
            } finally {
                solvedButton.disabled = false;
                unsolvedButton.disabled = false;
            }
        }

        solvedButton.addEventListener("click", function () { answerTroubleshooting(true); });
        unsolvedButton.addEventListener("click", function () { answerTroubleshooting(false); });
    </script>
</body>
</html>
