<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support Request</title>

    <style>
        :root {
            --navy: #102a43;
            --blue: #1769aa;
            --blue-dark: #0f4f82;
            --page: #eef4f8;
            --card: #ffffff;
            --line: #d9e2ec;
            --text: #243b53;
            --success-bg: #e8f7ef;
            --success-text: #0c5132;
            --error-bg: #fdecec;
            --error-text: #8a1c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 18px;
            font-family: Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, #d7ecff 0, transparent 36%),
                var(--page);
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(16, 42, 67, 0.12);
        }

        .header {
            padding: 30px 34px 25px;
            color: white;
            background: linear-gradient(135deg, var(--navy), var(--blue));
        }

        .header-icon {
            display: grid;
            width: 44px;
            height: 44px;
            margin-bottom: 14px;
            place-items: center;
            font-size: 22px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 12px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        .header p {
            margin: 8px 0 0;
            color: #d9eafd;
            line-height: 1.5;
        }

        form {
            padding: 12px 34px 34px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            color: var(--navy);
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            color: var(--text);
            font: inherit;
            background: white;
            border: 1px solid #bcccdc;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.14);
        }

        textarea {
            min-height: 145px;
            resize: vertical;
        }

        textarea::placeholder {
            color: #829ab1;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            width: 100%;
            margin-top: 26px;
            padding: 13px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: var(--blue);
            border: none;
            border-radius: 8px;
            transition: background 0.15s, transform 0.15s;
        }

        button:hover {
            background: var(--blue-dark);
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
            transform: none;
        }

        #result-box {
            display: none;
            margin-top: 20px;
            padding: 13px 14px;
            border-radius: 8px;
            line-height: 1.45;
        }

        #result-box.success {
            color: var(--success-text);
            background: var(--success-bg);
            border: 1px solid #c2ebd2;
        }

        #result-box.error {
            color: var(--error-text);
            background: var(--error-bg);
            border: 1px solid #f5c2c7;
        }

        #troubleshoot-panel {
            display: none;
            padding: 28px 34px 34px;
        }

        #troubleshoot-panel h2 {
            margin: 0 0 8px;
            color: var(--navy);
            font-size: 20px;
        }

        #troubleshoot-intro {
            margin: 0 0 14px;
            line-height: 1.5;
        }

        #troubleshoot-steps {
            margin: 0;
            padding: 16px 18px 16px 38px;
            line-height: 1.5;
            background: #f4f8fb;
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        #troubleshoot-steps li + li {
            margin-top: 8px;
        }

        .answer-question {
            margin: 22px 0 0;
            color: var(--navy);
            font-weight: bold;
        }

        .answer-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .answer-buttons button {
            margin-top: 12px;
        }

        #answer-error {
            display: none;
            margin-top: 16px;
            padding: 13px 14px;
            color: var(--error-text);
            background: var(--error-bg);
            border: 1px solid #f5c2c7;
            border-radius: 8px;
            line-height: 1.45;
        }

        button.secondary {
            color: var(--blue);
            background: white;
            border: 1px solid var(--blue);
        }

        button.secondary:hover {
            background: #eef6fc;
        }

        @media (max-width: 560px) {
            body {
                padding: 20px 12px;
            }

            #troubleshoot-panel {
                padding-right: 22px;
                padding-left: 22px;
            }

            .answer-buttons {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .header,
            form {
                padding-right: 22px;
                padding-left: 22px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="header">
            <div class="header-icon">?</div>
            <h1>IT Support Request</h1>
            <p>Tell us what you need help with and our support team will review your request.</p>
        </header>

        <form id="ticket-form">
            <label for="ticket_title">Ticket Title</label>
            <input
                type="text"
                id="ticket_title"
                name="ticket_title"
                placeholder="For example: Unable to connect to VPN"
                required
            >

            <div class="form-row">
                <div>
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="contact_number">Contact Number</label>
                    <input
                        type="tel"
                        id="contact_number"
                        name="contact_number"
                        autocomplete="tel"
                        required
                    >
                </div>
            </div>

            <label for="problem_description">Problem Description</label>
            <textarea
                id="problem_description"
                name="problem_description"
                placeholder="Please describe the issue, including any error messages you see."
                required
            ></textarea>

            <button type="submit" id="submit-button">Submit Support Request</button>

            <div id="result-box" role="status" aria-live="polite"></div>
        </form>

        <section id="troubleshoot-panel" aria-live="polite">
            <h2>Try these steps first</h2>
            <p id="troubleshoot-intro"></p>
            <ol id="troubleshoot-steps"></ol>

            <p class="answer-question">Did this solve your issue?</p>
            <div class="answer-buttons">
                <button type="button" id="solved-yes">Yes, it's solved</button>
                <button type="button" id="solved-no" class="secondary">No, I still need help</button>
            </div>

            <div id="answer-error" role="alert"></div>
        </section>
    </main>

    <script>
        const form = document.getElementById("ticket-form");
        const button = document.getElementById("submit-button");
        const resultBox = document.getElementById("result-box");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            button.textContent = "Submitting Request…";
            button.disabled = true;
            resultBox.style.display = "none";
            resultBox.className = "";

            const ticketData = {
                ticket_title: document.getElementById("ticket_title").value,
                name: document.getElementById("name").value,
                contact_number: document.getElementById("contact_number").value,
                problem_description: document.getElementById("problem_description").value
            };

            try {
                const response = await fetch("/submit-ticket", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(ticketData)
                });

                const data = await response.json();

                if (response.ok && data.status === "troubleshooting") {
                    // A low-urgency IT issue: show self-help steps. The ticket is
                    // not sent to the IT team unless the user says they did not help.
                    showTroubleshooting(data);
                    return;
                }

                if (!response.ok || data.status !== "success") {
                    throw new Error(data.reason || "Could not submit the support request.");
                }

                form.reset();
                showTicketSubmitted(data.ticket);
            } catch (error) {
                showResult(`Error: ${error.message}`, "error");
            } finally {
                button.textContent = "Submit Support Request";
                button.disabled = false;
            }
        });

        const panel = document.getElementById("troubleshoot-panel");
        const stepList = document.getElementById("troubleshoot-steps");
        const answerError = document.getElementById("answer-error");
        const solvedYes = document.getElementById("solved-yes");
        const solvedNo = document.getElementById("solved-no");
        let pendingId = null;

        function showResult(message, kind) {
            resultBox.textContent = message;
            resultBox.className = kind;
            resultBox.style.display = "block";
        }

        function showTicketSubmitted(ticket) {
            showResult(
                `Request ${ticket.ticket_id} submitted (${ticket.priority}, ` +
                `routed to ${ticket.department}). Our IT team will be in touch.`,
                "success"
            );
        }

        function showTroubleshooting(data) {
            pendingId = data.pending_id;
            document.getElementById("troubleshoot-intro").textContent = data.troubleshooting.intro;
            stepList.replaceChildren();
            for (const step of data.troubleshooting.steps) {
                const item = document.createElement("li");
                item.textContent = step;   // textContent: AI text is never parsed as HTML
                stepList.appendChild(item);
            }
            answerError.style.display = "none";
            solvedYes.disabled = false;
            solvedNo.disabled = false;
            form.style.display = "none";
            panel.style.display = "block";
        }

        function leaveTroubleshooting() {
            pendingId = null;
            panel.style.display = "none";
            form.style.display = "";
        }

        async function answer(solved) {
            solvedYes.disabled = true;
            solvedNo.disabled = true;
            answerError.style.display = "none";

            try {
                const response = await fetch(
                    `/api/pending-tickets/${encodeURIComponent(pendingId)}/answer`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ solved: solved })
                    });
                const data = await response.json();

                if (response.status === 410) {
                    // Expired or already answered: nothing more can be done here.
                    form.reset();
                    leaveTroubleshooting();
                    showResult(data.reason, "error");
                    return;
                }
                if (!response.ok) {
                    throw new Error(data.reason || "Could not send your answer.");
                }

                form.reset();
                leaveTroubleshooting();
                if (solved) {
                    showResult("Glad that fixed it! No support request was created.", "success");
                } else {
                    showTicketSubmitted(data.ticket);
                }
            } catch (error) {
                // Keep the panel open so the user can try again.
                answerError.textContent = `Error: ${error.message}`;
                answerError.style.display = "block";
                solvedYes.disabled = false;
                solvedNo.disabled = false;
            }
        }

        solvedYes.addEventListener("click", () => answer(true));
        solvedNo.addEventListener("click", () => answer(false));
    </script>
</body>
</html>
